# Сборка игры для Linux и Windows и выпуск версии.
#   git tag v0.2.0 && git push origin v0.2.0   — собрать и выложить на страницу выпуска
# Сначала — «Проверки» (ci.yml: тесты на Linux и Windows, OpenSpec) и сверка метки с версией;
# сборка начинается, только если всё зелёное.
#   Actions → «Сборка и выпуск» → Run workflow  — просто собрать (файлы — в результатах запуска)
# Браузерная версия (задача web) — spellgunners-web.zip в выпуске; сервер кладёт её на свой сайт (deploy/site.sh).
name: Сборка и выпуск

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ci:
    # те же проверки, что на каждый push (тесты Linux и Windows, самопроверка, OpenSpec)
    uses: ./.github/workflows/ci.yml

  checks:
    # до сборки: тег совпадает с версией в pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Тег = версия в pyproject.toml
        if: github.ref_type == 'tag'
        run: |
          v=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$v" != "${{ github.ref_name }}" ]; then
            echo "тег ${{ github.ref_name }}, а в pyproject.toml версия $v — сначала коммит «Версия …»"; exit 1
          fi

  build:
    needs: [ci, checks]
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 — чтобы сборка запускалась и на системах постарше
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      DUEL_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYTHONUTF8: "1"               # русские сообщения в журнале и на Windows
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Зависимости
        run: python -m pip install pygame==2.5.2 pyinstaller pillow

      - name: Inno Setup (установщик Windows)
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress

      - name: Сборка
        run: python tools/build.py

      - name: Самопроверка сборки (Linux)
        if: runner.os == 'Linux'
        run: ./dist/spellgunners-linux --selftest

      - name: Самопроверка сборки (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\spellgunners-windows.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "самопроверка не прошла: код $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: spellgunners-${{ runner.os }}
          if-no-files-found: ignore
          path: |
            dist/spellgunners-linux.tar.gz
            dist/spellgunners-linux
            dist/install.sh
            dist/spellgunners-windows.exe
            dist/spellgunners-setup.exe

  release:
    if: github.ref_type == 'tag'
    needs: [build, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true

      - name: Страница выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd files && sha256sum * > SHA256SUMS && cat SHA256SUMS)   # по ним игра проверяет обновление
          ls -l files
          # GitHub иногда отвечает 502 посреди загрузки: выпуск (черновик) уже есть, файлы — не все.
          # Повторяем: есть выпуск — догружаем файлы с заменой и публикуем; нет — создаём.
          for try in 1 2 3; do
            if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              gh release upload "${{ github.ref_name }}" files/* --clobber --repo "${{ github.repository }}" &&
                gh release edit "${{ github.ref_name }}" --draft=false --repo "${{ github.repository }}" && exit 0
            else
              gh release create "${{ github.ref_name }}" files/* \
                --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes && exit 0
            fi
            echo "выпуск не создался (попытка $try) — ещё раз через 20 с"; sleep 20
          done
          exit 1

  web:
    # браузерная версия (pygbag) — та же игра, собранная в WebAssembly; архив — в выпуск, его берёт сайт сервера
    needs: [ci, checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Зависимости
        run: |
          python -m pip install pygbag==0.9.3
          sudo apt-get update -q                     # список пакетов у раннера бывает устаревшим (404 на .deb)
          sudo apt-get install -y -q ffmpeg          # звуки и музыка — в .ogg

      - name: Сборка страницы
        run: |
          python tools/build_web.py
          python -m pygbag --build build/web-src

      - name: Архив для сайта сервера
        run: |
          mkdir -p dist
          (cd build/web-src/build/web && zip -q -r ../../../../dist/spellgunners-web.zip .)
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: spellgunners-web
          path: dist/spellgunners-web.zip
