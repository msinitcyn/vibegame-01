[project]
name = "spellgunners"
version = "0.8.12"
description = "Spellgunners — дуэль магов со стволами: артефакты, мобы, игра по сети"
requires-python = ">=3.10"
dependencies = ["pygame>=2.5"]

[dependency-groups]
dev = ["pytest>=8", "pyflakes>=3"]
build = ["pyinstaller>=6", "pillow>=10"]
web = ["pygbag>=0.9"]                  # браузерная версия: tools/build_web.py, python -m pygbag

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
