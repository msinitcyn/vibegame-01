schema: spec-driven

context: |
  Language: ru
  All artifacts must be written in ru.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.

  Project: «Дуэль шариков» — 2D-дуэль двух магов (синий/ледяной слева, красный/огненный
  справа) на Python 3.12 + pygame 2.6. Только два живых игрока на одном компьютере
  (клавиатура и геймпады PlayStation), без компьютерного соперника. Артефакты, инвентарь с очередью,
  волны мобов в центральной полосе, патроны, пиксельная графика, музыка.

  Code layout: main.py — запуск; пакет duel/: config.py (все числа и цвета баланса),
  items.py (артефакты), icons.py, entities.py (игрок, двойник, пуля, стена, моб…),
  commands.py (команда игрока), match.py (Match — все правила и состояние партии,
  step(dt, команды) -> события, свой генератор match.rng, номера объектов),
  gamepad.py, audio.py, screens.py (отрисовка), game.py (приложение: окно, меню,
  ввод -> команды, события -> звук и надписи, фиксированный такт 60 Гц),
  snapshot.py (снимок матча простыми данными, JSON-совместимый), render.py (отрисовка
  объектов поля по снимку; экран читает только game.snap), server.py (сервер без окна),
  net.py (TCP, JSON по строкам), bot.py (случайный бот), interp.py (плавная анимация клиента),
  i18n.py (все тексты на ru/en/fi), settings.py, sprites.py; assets/ — музыка, звуки,
  спрайты (PNG редактируемые); tools/make_sprites.py; tests/ — pytest.

  Conventions:
  - Правила — только в match.py/entities.py (без pygame вообще, звука, текста); вид и звук —
    в game.py/screens.py через события матча. Случайность — только match.rng.
  - Намеренное изменение правил — перезаписать эталон tools/fingerprint.py --save tests/data/fingerprint.json.
  - Числа баланса — константы в duel/config.py, не «магические числа» в коде.
  - Любой текст на экране — через i18n.t() с ключом во всех трёх языках (ru, en, fi).
  - Управление — по физическим клавишам (scancode), работает в любой раскладке;
    у каждого действия есть вариант для геймпада.
  - Новое поведение покрывается тестами в tests/; проверка: `.venv/bin/python -m pyflakes
    main.py duel tests tools` и `.venv/bin/python -m pytest -q`.
  - После изменения обновляется RUNBOOK.md (и справка в игре, если меняются правила).
  - Пользователь общается по-русски; комментарии в коде — по-русски.

